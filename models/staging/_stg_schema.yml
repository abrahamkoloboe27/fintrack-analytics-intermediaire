version: 2

models:
  - name: stg_comptes
    description: "Comptes clients nettoyés — renommage des colonnes, uniformisation du statut"
    columns:
      - name: compte_id
        description: "Identifiant unique du compte"
        tests:
          - unique
          - not_null
      - name: type_compte
        tests:
          - accepted_values:
              values: ['courant', 'epargne', 'joint']
      - name: statut
        tests:
          - accepted_values:
              values: ['actif', 'inactif', 'cloture']

  - name: stg_transactions
    description: "Transactions nettoyées avec montant signé calculé"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: compte_id
        tests:
          - relationships:
              to: ref('stg_comptes')
              field: compte_id

  - name: stg_categories
    description: "Catégories de transactions nettoyées"
    columns:
      - name: categorie_id
        tests:
          - unique
          - not_null

  - name: stg_budgets
    description: "Budgets mensuels nettoyés"
    columns:
      - name: budget_id
        tests:
          - unique
          - not_null
